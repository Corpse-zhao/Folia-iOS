name: Resign Folia ipa (ldid adhoc)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resign:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download raw input ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download resign-input -p input.ipa -O input.ipa

      - name: Resign
        run: |
          set -e
          brew install ldid
          rm -rf work && mkdir work && cd work
          unzip -q ../input.ipa

          # 清理过期签名材料
          find . -name embedded.mobileprovision -delete
          find . -name "_CodeSignature" -type d -exec rm -rf {} + || true

          # 移除损坏的 koffi 原生模块：原包已被截断
          # __TEXT 声明 704512 但文件仅 566972 字节，__DATA_CONST fileoff=704512 已越界
          # ldid 解析时 mach_header.GetSize() 断言失败
          rm -f "Payload/App.app/public/nodejs-project/node_modules/@koromix/koffi-darwin-arm64/darwin_arm64/koffi.node"

          # procursus ldid 2.1.5: `-S` 需要带 entitlements 文件参数，裸 `-S`/`-s` 会触发 flag_S 断言
          ldid -v || true
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict/></plist>' > /tmp/ent.plist
          plutil -lint /tmp/ent.plist

          for bin in \
            "Payload/App.app/App" \
            "Payload/App.app/Frameworks/Capacitor.framework/Capacitor" \
            "Payload/App.app/Frameworks/NodeMobile.framework/NodeMobile" \
            "Payload/App.app/Frameworks/Cordova.framework/Cordova"
          do
            echo "signing $bin"
            ldid -S/tmp/ent.plist "$bin"
          done

          zip -qry ../folia-resigned.ipa Payload
          ls -la ../folia-resigned.ipa

      - name: Verify
        run: |
          cd work
          echo "== App =="
          codesign -dv Payload/App.app/App 2>&1 | head -10 || true
          echo "== koffi.node =="
          find . -name "koffi.node" || echo "removed"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="resigned2-$(date +%Y%m%d%H%M)"
          gh release create "$VER" folia-resigned.ipa --title "Folia resigned v2 (koffi removed)" --notes "koffi.node removed (corrupt in source), ldid -s full resign" || \
            gh release upload "$VER" folia-resigned.ipa --clobber
